<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>표류소녀 계산기 모음</title>
    <meta
      name="description"
      content="표류소녀 간이 계산기 모음 - 마나, 성장 재화, DPS 계산기"
    />
    <link rel="icon" type="image/png" href="assets/icon_mana_flame_final.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <div class="page-inner">
        <div class="card">
          <div class="card-header">
            <img
              src="assets/title_logo.png"
              alt="표류소녀"
              class="card-logo"
            />
            <div class="card-title">표류소녀 계산기 모음</div>
            <div class="card-subtitle">
              원하는 계산기를 골라주세요. 미완성이라 실제 결과와 다를 수 있어요!
            </div>
          </div>

          <div class="card-body">
            <div class="calc-list">
              <a href="./mana_calc.html" class="calc-link">
                <img
                  src="assets/icon_mana_flame_final.png"
                  alt=""
                  class="calc-link-icon"
                />
                <div class="calc-link-body">
                  <div class="calc-link-name">간단 마나 계산기</div>
                  <div class="calc-link-desc">
                    스킬 유지에 필요한 마나 수급률을 계산해요.
                  </div>
                </div>
              </a>

              <a href="./growth_calc.html" class="calc-link">
                <img
                  src="assets/essence.png"
                  alt=""
                  class="calc-link-icon"
                />
                <div class="calc-link-body">
                  <div class="calc-link-name">성장 재화 계산기</div>
                  <div class="calc-link-desc">
                    목표 성장까지 필요한 재화량을 계산해요.
                  </div>
                </div>
                <div class="calc-badge-soon">준비중</div>
              </a>

              <a href="./dps_calc.html" class="calc-link">
                <img
                  src="assets/icon_world_final.png"
                  alt=""
                  class="calc-link-icon"
                />
                <div class="calc-link-body">
                  <div class="calc-link-name">DPS 계산기</div>
                  <div class="calc-link-desc">
                    장비/스킬 조합의 초당 피해량을 계산해요.
                  </div>
                </div>
                <div class="calc-badge-soon">준비중</div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
